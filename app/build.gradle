import java.util.Properties

plugins { id "com.android.application" }

def signingPropertiesFile = rootProject.file("signing-private/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "io.github.yylsping.bilihook"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.yylsping.bilihook"
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName "1.8.0"
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingPropertiesFile.isFile() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "bili hook_1.8.0.apk"
        }
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
        }
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
    testImplementation "io.github.libxposed:api:102.0.0"
    testImplementation "junit:junit:4.13.2"
}
